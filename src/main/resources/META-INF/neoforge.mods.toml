modLoader = "javafml"
loaderVersion = "[1,)"
license = "MPL-2.0"
issueTrackerURL = "https://github.com/traelmyx/shrines-reborn/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "traelmyx, Silverminer007"
${logo_key} = "assets/shrines/icon.png"
description = '''Adds 30 structures to world generation: temples, shrines, villas, towers, a harbour and more. Based on Shrines Structures by Silverminer007.'''

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_major},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${mc_dep}"
ordering = "NONE"
side = "BOTH"
